<!-- templates/_base.html -->
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>{% block title %}Bookstore{% endblock title %}</title>

  <!-- CSS Bootstrap 5.3.3 (جدید و پایدار) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS شخصی شما -->
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />

  {% block extra_css %}{% endblock extra_css %}
</head>
<body>

  <!-- Navbar مدرن Bootstrap 5 -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-3">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">Bookstore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="p-2 text-dark" href="{% url 'about' %}">About</a>
            </li>
          </ul>
          <div class="d-flex">
            {% if user.is_authenticated %}
              <a class="btn btn-outline-danger me-2" href="{% url 'logout' %}">Log Out</a>
            {% else %}
              <a class="btn btn-outline-secondary me-2" href="{% url 'login' %}">Log In</a>
              <a class="btn btn-primary" href="{% url 'signup' %}">Sign Up</a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    {% block content %}
    <!-- محتوای صفحات اینجا قرار می‌گیرد -->
    {% endblock content %}
  </main>

  <!-- JavaScript Bootstrap 5 (به jQuery و Popper جداگانه نیاز ندارد) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- جاوااسکریپت شخصی شما -->
  <script src="{% static 'js/base.js' %}"></script>

  {% block extra_js %}{% endblock extra_js %}
</body>
</html>
